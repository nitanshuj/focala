services:
  - type: web
    name: focala-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Security: set to your production Netlify URL (no trailing slash)
      - key: FRONTEND_URL
        sync: false
      # Security: comma-separated list of allowed CORS origins
      - key: ALLOWED_ORIGINS
        sync: false
      # IMPORTANT: Do NOT set DEBUG=true in production. Omit this variable entirely.
      # - key: DEBUG
      #   value: "false"
    plan: starter